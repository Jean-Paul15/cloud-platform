# Configuration Nginx - API Gateway Sécurisée
# DBaaS Project

events {
    worker_connections 1024;
}

http {
    # Logs détaillés
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Compression GZIP pour optimiser les performances
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1000;

    # Rate Limiting : 10 requêtes par seconde par IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Upstreams
    upstream auth_service {
        server dbaas-auth:3000;
        keepalive 32;
    }

    upstream manager_service {
        server dbaas-manager:3000;
        keepalive 32;
    }

    # Redirection HTTP vers HTTPS
    server {
        listen 80;
        server_name _;

        # Health check accessible en HTTP (pour Docker healthcheck)
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "Gateway OK\n";
        }

        # Rediriger tout le reste vers HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Serveur HTTPS principal
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Certificats SSL
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Configuration SSL sécurisée
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Headers de sécurité
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Route Service d'Authentification
        location ~ ^/auth(/|$) {
            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/auth/(.*) /$1 break;
            rewrite ^/auth$ / break;

            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Désactiver le buffering pour les requêtes streaming
            proxy_buffering off;
        }

        # Route Service Manager
        location ~ ^/api(/|$) {
            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/(.*) /$1 break;
            rewrite ^/api$ / break;

            proxy_pass http://manager_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
        }

        # Health Check endpoint
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "Gateway OK (HTTPS)\n";
        }
    }
}
